######################################################################
# environment and task
env_suite: isaac
env: xarm_screwdriver

# future action forecasts
action_dim: 6
horizon_steps: 4

# observation history
obs_dim: 6  # 6D end-effector pose [x, y, z, roll, pitch, yaw]
cond_steps: 1
img_cond_steps: 1

# observation shape
shape_meta:
  obs:
    rgb:
      shape: [3, 96, 96]
    state:
      shape: [6]
  action: 
    shape: [6]
###################################################################

defaults:
  - _self_

hydra:
  run:
    dir: ${logdir}

_target_: agent.pretrain.train_shortcut_agent.TrainShortCutAgent
name: ${env}_pre_shortcut_mlp_img_ta${horizon_steps}_td${denoising_steps}

logdir: ${oc.env:REINFLOW_LOG_DIR}/isaac/pretrain/${env}/${name}/${now:%Y-%m-%d}_${now:%H-%M-%S}_${seed}
train_dataset_path: ${oc.env:REINFLOW_DATA_DIR}/isaac/${env}/train.npz

denoising_steps: 20
batch_size: 128
seed: 42
device: cuda:0

wandb:
  entity: ${oc.env:REINFLOW_WANDB_ENTITY}
  project: isaac-${env}-pretrain
  run: ${now:%Y-%m-%d}_${now:%H-%M-%S}_${name}
  offline_mode: false

train:
  n_epochs: 1000
  batch_size: ${batch_size}
  learning_rate: 1e-4
  weight_decay: 1e-6
  lr_scheduler:
    first_cycle_steps: 1000
    warmup_steps: 50
    min_lr: 1e-5
  save_model_freq: 200
  epoch_start_ema: 20
  update_ema_freq: 10

model:
  _target_: model.flow.shortcutflow.ShortCutFlow
  network:
    _target_: model.flow.mlp_shortcut.ShortCutFlowViT
    backbone:
      _target_: model.common.vit.VitEncoder
      obs_shape: ${shape_meta.obs.rgb.shape}
      num_channel: ${eval:'${shape_meta.obs.rgb.shape[0]} * ${img_cond_steps}'}
      cfg:
        patch_size: 8
        depth: 1
        embed_dim: 128
        num_heads: 4
        embed_style: embed2
        embed_norm: 0
    img_cond_steps: ${img_cond_steps}
    augment: true
    num_img: 1
    visual_feature_dim: 128
    td_emb_dim: 32
    mlp_dims: [512, 512, 512]
    residual_style: true
    prop_dim: ${eval:'${obs_dim} * ${cond_steps}'}
    horizon_steps: ${horizon_steps}
    action_dim: ${action_dim}
  device: ${device}
  horizon_steps: ${horizon_steps}
  action_dim: ${action_dim}
  act_min: -1
  act_max: 1 
  obs_dim: ${obs_dim}
  max_denoising_steps: ${denoising_steps}
  seed: ${seed}

ema:
  decay: 0.995

train_dataset:
  _target_: agent.dataset.sequence.StitchedSequenceDataset
  use_img: true
  dataset_path: ${train_dataset_path}
  horizon_steps: ${horizon_steps}
  cond_steps: ${cond_steps}
  img_cond_steps: ${img_cond_steps}
  device: ${device}
