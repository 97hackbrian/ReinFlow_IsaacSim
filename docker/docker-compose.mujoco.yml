version: '3.8'

services:
  reinflow-mujoco:
    build:
      context: ..
      dockerfile: docker/Dockerfile.mujoco
    image: reinflow:mujoco
    container_name: reinflow-mujoco-container
    runtime: nvidia
    shm_size: '16gb'
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - DISPLAY=${DISPLAY}
      - GDK_BACKEND=x11
      - QT_QPA_PLATFORM=xcb
      - SDL_VIDEODRIVER=x11
      - MUJOCO_GL=egl
      - WANDB_API_KEY=${WANDB_API_KEY}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ..:/workspace/ReinFlow:rw
      - ~/.cache/wandb:/root/.cache/wandb:rw
    ipc: host
    network_mode: host
    stdin_open: true
    tty: true
    working_dir: /workspace/ReinFlow
    command: /bin/bash
